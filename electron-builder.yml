# electron-builder.yml — Windows 桌面版打包配置
#
# 用法：npm run desktop:dist（在 Windows 上跑，见下面"为什么不在这台机器上打包"）
#
# ## asar: false
# 服务端要 spawn 自己、要加载原生模块（sharp）、要读写用户工作区。
# asar 是只读虚拟包，这三件事在里面全是坑。少一层压缩换掉一整类问题。
#
# ## 随包带一份 node.exe，npmRebuild: false
# 服务端子进程用安装包里的 node.exe 跑（desktop.yml 在 windows-latest 上抓的，Node 24），Electron 只当窗口壳。
# 09-06 把 better-sqlite3 换成 Node 自带的 node:sqlite 之后仓库里没有需要按运行时编译的原生模块了
# （sharp 是 N-API，预编译按平台分包），这一行是"别去碰 node_modules"。
#
# ## 为什么不在这台 Linux 机器上打包
# 两个 win32 产物都得是真的 Windows 二进制：SDK 的 claude.exe（平台包
# @anthropic-ai/claude-agent-sdk-win32-x64）和 sharp 的 @img/sharp-win32-x64。在 arm64 Linux 上让 npm 装另一个平台的包要一路
# --os/--cpu 覆盖，装出来还没法跑起来验。在 Windows 机器或 GitHub Actions 的
# windows-latest 上打包，这些是默认行为，不用任何特殊处理。

# 只往打包产物的 package.json 里注入 main。源码 package.json 不写这个字段：
# npm 会无视 files 黑名单强制把 main 指向的文件打进 npm 包（实测：desktop/main.js
# 就是这么漏进去的）。这也是为什么"哪些文件不发出去"不能只靠黑名单。
extraMetadata:
  main: desktop/main.js

appId: com.xiaobuyu.nodesign
productName: NoDesign
copyright: Copyright © 2026 Xiaokebuyu

asar: false
npmRebuild: false

directories:
  output: dist-desktop
  buildResources: desktop/build

# 进安装包的东西。跟 package.json 的 files（那是 npm 包的）各管各的：
# npm 包不发 desktop/，桌面包不发测试和实验目录。
files:
  - bin/**/*
  - desktop/**/*
  - server/**/*
  - web/dist/**/*
  - package.json
  - LICENSE
  - README.md
  - "!server/**/*.test.js"
  - "!server/**/_probe-*"
  - "!server/**/_*-check.mjs"
  - "!server/**/_smoke.js"
  - "!server/db/**"
  - "!server/runs/**"
  - "!server/projects-data/**"
  - "!server/scripts/**"
  - "!server/hosted/**"                    # 服务端外环（relay / 管理台），客户端不带；跟 package.json 的 files 一致
  - "!desktop/components/**"               # 随包组件走 extraResources 进 resources/，别再往 app/ 里复制一份
  - "!server/skills/installed/**"
  - "!server/lib/docx/lab/**"
  - "!server/lib/ssrf-lab/**"
  - "!web/dist/mock/**"

# 随包分发的组件。现在只有 node.exe（服务端的运行时，见上）；chromium / LibreOffice / ffmpeg /
# poppler / rembg 环境还没接（见 desktop/README.md 的"组件"一节），接的时候同样抓进
# desktop/components/<name>/ 再在这里加一条。装机后落在 <安装目录>/resources/<to>/。
extraResources:
  - from: desktop/components/node
    to: node
    filter: ['node.exe']

win:
  target:
    - target: nsis
      arch: [x64]
  icon: desktop/build/icon.png          # 1024² PNG，electron-builder 自己转 .ico（多尺寸）
  # 没有代码签名证书时这两行留空即可，代价是首次运行会被 SmartScreen 拦一道
  # "未知发布者"，用户要点两次。买了 OV/EV 证书再填。
  # certificateFile:
  # certificatePassword:

nsis:
  oneClick: false                          # 给用户选安装目录的机会，别一键装到 C 盘就完事
  perMachine: false                        # 装到用户目录，不要求管理员权限
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: NoDesign
  # 卸载时不动 ~/.nodesign：那里面是用户的项目和产物，卸载软件不该删作品
  deleteAppDataOnUninstall: false

# 更新源 = GitHub Releases（仓库是公开的，electron-updater 不用 token 就能读 latest.yml）。
# 打包在 GitHub Actions 的 windows-latest 上做（.github/workflows/desktop.yml），产物直接传进
# Release：安装包 .exe、.blockmap、latest.yml。有 blockmap 对得上就下差分，对不上就退回下整包 ——
# 完整包更新和差分更新是同一套配置的两条路径，不是两套。
# releaseType: draft —— 打出来的是**草稿**，站主在 GitHub 上点 Publish 之后用户端才会看到更新；
# 草稿本身站主自己能下载来试。想跳过这一步改成 release。
publish:
  - provider: github
    owner: Xiaokebuyu
    repo: Nodesign
    releaseType: draft
