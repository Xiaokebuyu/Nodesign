<!--
  ╔══════════════════════════════════════════════════════════════════════╗
  ║  NoDesign · canvas.html starter template (Hybrid 范式 · 2026-05-08)  ║
  ╠══════════════════════════════════════════════════════════════════════╣
  ║                                                                      ║
  ║  cp 这份做起点。下面 4 块预置好的，**别动结构**：                      ║
  ║    1. <head> 里的 Tailwind / importmap / Babel + design-tokens       ║
  ║    2. <head> base CSS 里 section[data-page] var(--deck-w/h)           ║
  ║       （设计稿坐标系，由 wrap data-deck-aspect 4 档决定 W×H）          ║
  ║    3. body 的 .__nd-deck-wrap 包裹 + <section data-page>              ║
  ║    4. <script id="__nd-shadcn-lite"> 里的 4 件 shadcn-lite 组件       ║
  ║       (Card/Button/Badge/Tabs)，直接 <Card> 用，不需要 import        ║
  ║                                                                      ║
  ║  渲染范式（系统统一处理，agent 不操心）：                                ║
  ║    · 每个 <section data-page> 写设计稿原坐标                          ║
  ║    · 系统给每 section 包 100vw×100vh frame + scroll-snap →            ║
  ║      单页铺满屏幕；滚轮 / 键盘 ↑↓ Space PgUp/PgDn 都按页切             ║
  ║    · 缩放纯 CSS min(100vw/W, 100vh/H) letterbox 居中                  ║
  ║                                                                      ║
  ║  Deck 比例（钉锚阶段必须跟用户对齐 → 改 wrap data-deck-aspect 四选一）：║
  ║    "16:9"   1920×1080  默认（PPT / 演讲 / 文档）                      ║
  ║    "16:10"  1920×1200  宽屏笔电 / Mac 屏（介于 16:9 和 4:3）          ║
  ║    "9:16"   1080×1920  竖屏（手机 / 短故事 / 直播 cover）              ║
  ║    "4:3"    1440×1080  老投影 / 经典 PPT                             ║
  ║    比例**只能创建时定**——版面写死针对某比例，切了版面错乱             ║
  ║                                                                      ║
  ║  你要做的：                                                           ║
  ║    · 改 design-tokens（颜色 / 字号 / 字体）—— 按 deck 隐喻整组覆盖     ║
  ║    · 在 .__nd-deck-wrap 里写 N 个 <section data-page="N">             ║
  ║    · **决定每页 layout-role 后**→ Read patterns/<role>.md 拿 reference║
  ║      (image-led-cover / section-divider / portrait / quote-backdrop  ║
  ║       / text-led / hybrid-grid)                                      ║
  ║    · 简单页：纯 HTML + Tailwind utility class                         ║
  ║    · 复杂页（图表 / 动画 / Tabs/Card 阵列）：放 <div data-react-mount="..."> ║
  ║      然后在底部 <script id="__nd-app"> 里 createRoot mount 组件      ║
  ║                                                                      ║
  ║  Tweaks 桥接：可调维度（颜色/字号）用 text-[var(--accent)] 写         ║
  ║              骨架（间距/flex/radius）用 Tailwind utility 写           ║
  ║              expose_tweaks 改 CSS var → arbitrary value 实时响应      ║
  ║                                                                      ║
  ║  Anchor 单写：关键元素只写 data-anchor（deck 内唯一，重名加 -pN 后缀） ║
  ║              不再写 data-node-id（已废）                              ║
  ║                                                                      ║
  ║  库速查见 prelude § Hybrid 全家桶库速查 + SKILL.md § Hybrid 选型表    ║
  ║                                                                      ║
  ╚══════════════════════════════════════════════════════════════════════╝
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{Deck 标题 · 改我}</title>

  <!-- ══ 1. Google Fonts（按需改） ══ -->
  <!-- ⚠️ 字体 chain 铁律：每个 latin family 后面**必须**跟显式的 CJK family。     -->
  <!--    标准 chain 4 段：latin → 苹果 CJK → Noto CJK 兜底 → generic              -->
  <!--    - sans 类  → 'Inter', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif -->
  <!--    - serif 类 → 'Playfair Display', 'Songti SC', 'Noto Serif SC', serif      -->
  <!--    - mono 类  → 'JetBrains Mono', monospace（mono 极少含中文，不配 CJK）     -->
  <!--                                                                              -->
  <!-- 为什么 4 段而不是 3 段：                                                     -->
  <!--   PingFang/Songti 是苹果字体，preview（macOS）和 server 渲染都装了，命中     -->
  <!--   它们后字体效果"原汁原味"（设计师爱的 PingFang Light 骨感）。               -->
  <!--   Noto SC 是 Google Fonts inline 的兜底——用户下载 baked HTML 在 Windows/    -->
  <!--   Linux 双击打开时（没装苹果字体）能命中 inline 的 Noto SC，不掉链。         -->
  <!--                                                                              -->
  <!-- ❌ 反例：                                                                    -->
  <!--   font-family: 'Playfair', serif        ← 缺 CJK，跨 OS 命中不一致           -->
  <!--   font-family: 'Inter', system-ui       ← system-ui 跨 OS 命中不一致         -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=JetBrains+Mono:wght@400;600&family=Instrument+Serif:ital@0;1&family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- ══ 2. Tailwind Play CDN（运行时编译，所有 utility class 立即可用） ══ -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          // ⚠️ 4 段 chain：latin → 苹果 CJK（preview/server 命中）→ Noto CJK 兜底 → generic
          fontFamily: {
            sans:    ['Inter', 'PingFang SC', 'Noto Sans SC', 'system-ui', 'sans-serif'],
            mono:    ['JetBrains Mono', 'monospace'],
            display: ['Instrument Serif', 'Songti SC', 'Noto Serif SC', 'serif'],
          },
        },
      },
    };
  </script>

  <!-- ══════════════════════════════════════════════════════════════════════════════ -->
  <!-- ══ 3. importmap：21 库预置 + 按 deck-kind 分组（agent import 哪个浏览器才下哪个）══ -->
  <!--                                                                                -->
  <!-- 按 deck-kind 选型 → SKILL.md § Hybrid 选型按 deck-kind 分流                    -->
  <!-- 按内容类型查（"我要画图表 → recharts"）→ prelude § Hybrid 全家桶库速查         -->
  <!--                                                                                -->
  <!-- 库分组（下方 JSON 按此顺序排列）：                                              -->
  <!--   Core ............... react / react-dom（必装）                              -->
  <!--   数据可视化 ......... recharts / echarts                                      -->
  <!--                       适用：decision / sales / funding / data / academic       -->
  <!--   动效装饰 ........... framer-motion / motion / gsap / lenis                   -->
  <!--                       放开：emotion / launch / ceremony                       -->
  <!--                       慎用：decision / academic / data 默认 0 motion           -->
  <!--   流程公式代码 ....... mermaid / katex / react-katex / shiki                   -->
  <!--                       适用：knowledge / academic                              -->
  <!--   专业组件 ........... lucide-react (icon) / embla-carousel-react (轮播)       -->
  <!--                       reactflow (节点图)                                       -->
  <!--   Radix 组件 ......... 6 件 a11y 全功能 (要键盘导航时；inline 4 件已自带简化版) -->
  <!--   3D ................. three / r3f / drei                                      -->
  <!--                       launch 类产品 hero 偶用，体积大耗 GPU 慎用              -->
  <!-- ══════════════════════════════════════════════════════════════════════════════ -->
  <script type="importmap">
  {
    "imports": {
      "react":              "https://esm.sh/react@19.0.0",
      "react/":             "https://esm.sh/react@19.0.0/",
      "react-dom":          "https://esm.sh/react-dom@19.0.0",
      "react-dom/":         "https://esm.sh/react-dom@19.0.0/",

      "recharts":           "https://esm.sh/recharts@2.13.3?deps=react@19.0.0,react-dom@19.0.0",
      "echarts":            "https://esm.sh/echarts@5.5.1",
      "echarts-for-react":  "https://esm.sh/echarts-for-react@3.0.2?deps=react@19.0.0,react-dom@19.0.0,echarts@5.5.1",

      "framer-motion":      "https://esm.sh/framer-motion@11.15.0?deps=react@19.0.0,react-dom@19.0.0",
      "motion":             "https://esm.sh/motion@11.15.0?deps=react@19.0.0,react-dom@19.0.0",
      "gsap":               "https://esm.sh/gsap@3.12.5",
      "lenis":              "https://esm.sh/lenis@1.1.20",

      "mermaid":            "https://esm.sh/mermaid@11.4.1",
      "katex":              "https://esm.sh/katex@0.16.11",
      "react-katex":        "https://esm.sh/react-katex@3.0.1?deps=react@19.0.0,katex@0.16.11",
      "shiki":              "https://esm.sh/shiki@1.24.4",

      "lucide-react":       "https://esm.sh/lucide-react@0.460.0?deps=react@19.0.0",
      "embla-carousel-react": "https://esm.sh/embla-carousel-react@8.5.1?deps=react@19.0.0",
      "reactflow":          "https://esm.sh/reactflow@11.11.4?deps=react@19.0.0,react-dom@19.0.0",

      "@radix-ui/react-dialog":     "https://esm.sh/@radix-ui/react-dialog@1.1.4?deps=react@19.0.0,react-dom@19.0.0",
      "@radix-ui/react-tabs":       "https://esm.sh/@radix-ui/react-tabs@1.1.2?deps=react@19.0.0,react-dom@19.0.0",
      "@radix-ui/react-tooltip":    "https://esm.sh/@radix-ui/react-tooltip@1.1.5?deps=react@19.0.0,react-dom@19.0.0",
      "@radix-ui/react-accordion":  "https://esm.sh/@radix-ui/react-accordion@1.2.2?deps=react@19.0.0,react-dom@19.0.0",
      "@radix-ui/react-popover":    "https://esm.sh/@radix-ui/react-popover@1.1.4?deps=react@19.0.0,react-dom@19.0.0",
      "@radix-ui/react-scroll-area":"https://esm.sh/@radix-ui/react-scroll-area@1.2.2?deps=react@19.0.0,react-dom@19.0.0",

      "three":                  "https://esm.sh/three@0.171.0",
      "@react-three/fiber":     "https://esm.sh/@react-three/fiber@8.17.10?deps=react@19.0.0,react-dom@19.0.0,three@0.171.0",
      "@react-three/drei":      "https://esm.sh/@react-three/drei@9.121.4?deps=react@19.0.0,react-dom@19.0.0,three@0.171.0,@react-three/fiber@8.17.10"
    }
  }
  </script>

  <!-- ══ 4. Babel Standalone：浏览器内编译 TSX ══ -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- ══ 5. Design tokens —— **可调维度全在这里**，agent 改这里 ══ -->
  <!-- ┄┄┄ 下面这套 token 值是 fallback，风格名定了之后**应主动按它覆盖**：   ┄┄┄ -->
  <!-- ┄┄┄   · 瑞士网格           → 白底 / 单一无衬线 / 严格栅格            ┄┄┄ -->
  <!-- ┄┄┄   · 终端 HUD           → 深底 / 单一荧光色 / 等宽数字            ┄┄┄ -->
  <!-- ┄┄┄   · 杂志编辑风         → 衬线大标题 / 通栏窄栏混排 / 出血图      ┄┄┄ -->
  <!-- ┄┄┄ 直接套用预置 = 5 deck 出来都长一样的 AI default。每份 deck 的 token ┄┄┄ -->
  <!-- ┄┄┄ 应该被它的隐喻穿透，把整组 --bg / --ink / --accent / --muted 重写。┄┄┄ -->
  <style id="design-tokens">
    :root {
      /* === Color (fallback values — override per theme) === */
      --bg:       #F9F8F6;
      --paper:    #F9F8F6;
      --surface:  #ffffff;
      --ink:      #1a120a;
      --accent:   #2d2418;
      --muted:    #6b5d4f;
      --cream:    #efe8df;

      /* === Type scale === */
      --hero:     112px;
      --h1:       72px;
      --h2:       48px;
      --h3:       32px;
      --body:     18px;
      --caption:  13px;

      /* === Spacing (8pt grid) === */
      --gap-xs:   8px;
      --gap-sm:   16px;
      --gap-md:   24px;
      --gap-lg:   48px;
      --gap-xl:   96px;

      /* === Generated image slots === */
      --hero-image:        none;
      --bg-image-1:        none;
      --bg-image-2:        none;
      --bg-image-3:        none;
      --decoration-1:      none;
      --frame-1:           none;
      --pattern-tile:      none;
    }

    /* per-page / per-layout scoped overrides 跟 expose_tweaks(target_scope) 配对 */
    /* section[data-page="1"] { --hero: 140px; }   ← 封面字更大 */
    /* [data-layout="quote"] { --body: 24px; }     ← 引言页正文更大 */
  </style>

  <!-- ══ 6. Base —— **不要动**，跟系统注入 fit script 共契约 className ══ -->
  <style id="base">
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif;
      color: var(--ink);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }

    /* section 尺寸跟随 wrap data-deck-aspect 派发的 CSS var；不声明 = 16:9 默认 */
    section[data-page] {
      width: var(--deck-w, 1920px);
      height: var(--deck-h, 1080px);
      position: relative;
      overflow: hidden;
      page-break-after: always;
    }
  </style>

  <!-- ══ 7. Page-styles —— 页内细化样式（per-page 重写 token / 个别页 layout 微调） ══ -->
  <style id="page-styles">
    /* 例：page 3 数字超大字 */
    /* section[data-page="3"] .stat-num { font-family: var(--font-display); font-size: 200px; } */
  </style>
</head>

<body>

<!-- ════════════════════════════════════════════════════════════ -->
<!-- 所有 section 必须放在 .__nd-deck-wrap 里。                       -->
<!--                                                                -->
<!-- 渲染范式（系统统一）：                                            -->
<!--   · 每个 <section data-page="N"> 写设计稿原坐标                   -->
<!--   · 系统在 preview / 导出 / 离线打开时自动给每 section 包         -->
<!--     100vw×100vh frame + scroll-snap → 单页铺满屏幕                -->
<!--     滚轮一次切一整页 / 键盘 ↑↓ Space PgUp/PgDn 也按页切            -->
<!--   · 缩放 CSS min(100vw/W, 100vh/H) letterbox 居中                -->
<!--                                                                -->
<!-- deck 比例 data-deck-aspect 四档（**钉锚阶段必须跟用户对齐**）：    -->
<!--   "16:9"   1920×1080  默认（PPT / 演讲 / 文档 / scrollytelling）  -->
<!--   "16:10"  1920×1200  宽屏笔电 / Mac 屏（多一点垂直空间）          -->
<!--   "9:16"   1080×1920  竖屏（手机宣发 / 短故事 / 直播 cover）       -->
<!--   "4:3"    1440×1080  老投影 / 经典 PPT 投影仪适配                -->
<!--                                                                -->
<!-- 漏写 = 默认 16:9。比例**只能在 deck 创建时定**，不能导出时切——      -->
<!-- 因为 layout 写死针对某个比例，切了就版面错乱。                     -->
<!-- ════════════════════════════════════════════════════════════ -->
<div class="__nd-deck-wrap" data-deck-aspect="16:9">

  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- PAGE 1 · COVER (text-led 范例)                              -->
  <!--   · 这是最简 cover 起手骨架；image-led / 其他 layout-role    -->
  <!--     **必 Read patterns/<role>.md** 拿专属 reference          -->
  <!--   · DirectEdit 双击文字可改                                   -->
  <!--   · 颜色用 text-[var(--xxx)]，骨架用 Tailwind utility         -->
  <!--   · Anchor 单写：data-anchor 唯一，不写 data-node-id          -->
  <!-- ══════════════════════════════════════════════════════════ -->
  <section data-page="1" data-anchor="cover" data-layout="cover"
           data-layout-role="text-led" class="bg-[var(--paper)]">
    <div class="h-full flex flex-col justify-between p-32">
      <div class="font-mono text-sm tracking-[0.3em] uppercase text-[var(--muted)]">
        {Section · 改我}
      </div>

      <div class="flex flex-col gap-8">
        <h1 data-anchor="cover-title"
            class="font-display text-[var(--ink)] leading-[0.95]"
            style="font-size: var(--hero); letter-spacing: -0.04em;">
          {封面标题 · 改我}
        </h1>
        <p data-anchor="cover-sub"
           class="text-2xl text-[var(--muted)] max-w-3xl leading-relaxed"
           style="font-family: 'Instrument Serif', 'Songti SC', 'Noto Serif SC', serif; font-style: italic;">
          {副标题 · 一句话讲清这个 deck 是什么 · 改我}
        </p>
      </div>

      <div class="flex justify-between items-end font-mono text-xs uppercase tracking-widest text-[var(--muted)]">
        <span>{author · date}</span>
        <span>01 / N</span>
      </div>
    </div>
  </section>

  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- 6 个 page-type 范例已搬到 patterns/ 目录（按需 Read）        -->
  <!--                                                            -->
  <!-- 决定每页 layout-role 后立即 Read 对应 patterns/*.md：        -->
  <!--   image-led 封面 / 大 hero      → patterns/image-led-cover.md -->
  <!--   image-led 章节扉页            → patterns/section-divider.md -->
  <!--   image-led 人物 / quote        → patterns/portrait.md / quote-backdrop.md -->
  <!--   text-led 文为主页              → patterns/text-led.md         -->
  <!--   hybrid 图文 grid / Card 阵列   → patterns/hybrid-grid.md      -->
  <!--                                                            -->
  <!-- 每个 patterns/ 文件含：何时用 / 标记规约 / 写法铁律 / 最小代码片段 -->
  <!-- 别照抄当 final layout —— patterns/ 是 reference，按你 deck 的隐喻填  -->
  <!-- ══════════════════════════════════════════════════════════ -->

  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- ⚡ 骨架范例（Phase A · ≤ 400 行起步用）                          -->
  <!-- 多页 deck 或预估 > 400 行的复杂单页：先把每页 section 写成空骨架   -->
  <!-- 整文件 ≤ 400 行 → expose_tweaks 一次 → 逐页 Edit 填充            -->
  <!-- 详见 SKILL.md § 二、展开 起手式                          -->
  <!-- ══════════════════════════════════════════════════════════ -->

  <!-- ┄┄┄ 骨架 section 范例（cp 改 N 份，N = 你 plan 的页数） ┄┄┄
  <section data-page="1" data-layout-role="image-led" data-layout="cover"
           data-anchor="cover" data-skeleton="cover-hero">
    <div class="h-full flex items-center justify-center bg-[var(--ink)]/5
                text-[var(--muted)] font-mono text-sm tracking-widest">
      PAGE 1 · cover-hero · WIP
    </div>
  </section>
  ┄┄┄ -->

  <!-- ┄┄┄ React mount 占位（在底部 <script id="__nd-app"> 里）┄┄┄
  // §mount:2  · data-led page 2 chart component 待填
  ┄┄┄ -->

  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- PAGE 2 · React mount section 范例                            -->
  <!--   · 复杂图表/动画/组件用 React mount                          -->
  <!--   · 必须 <div data-react-mount="..."> 包裹（DirectEdit guard）-->
  <!--   · mount 实现写在底部 <script id="__nd-app"> 里             -->
  <!-- ══════════════════════════════════════════════════════════ -->
  <section data-page="2" data-anchor="example-mount" data-layout="data"
           data-layout-role="data-led" class="bg-[var(--cream)]">
    <div class="h-full flex flex-col p-24">
      <header class="mb-12 pb-8 border-b border-[var(--ink)]/10">
        <div class="font-mono text-xs uppercase tracking-[0.3em] text-[var(--muted)] mb-2">
          Section · React mount example
        </div>
        <h2 data-anchor="example-mount-title"
            class="font-display text-[var(--ink)]"
            style="font-size: var(--h1); letter-spacing: -0.02em; line-height: 1;">
          {改成你的 page 标题}
        </h2>
      </header>

      <!-- React mount point ↓ —— DirectEdit 不会挂这里面（guard by data-react-mount） -->
      <div data-react-mount="example-chart" id="example-chart-mount" class="flex-1"></div>
    </div>
  </section>

  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- PAGE N · CLOSING —— 静态 + 优雅落幕                          -->
  <!-- ══════════════════════════════════════════════════════════ -->
  <section data-page="3" data-anchor="closing" data-layout="closing"
           data-layout-role="text-led" class="bg-[var(--ink)] text-[var(--paper)]">
    <div class="h-full flex flex-col justify-center items-center text-center p-32">
      <div class="font-mono text-xs uppercase tracking-[0.4em] text-[var(--paper)]/50 mb-8">
        — Fin —
      </div>
      <h2 data-anchor="closing-title"
          class="font-display"
          style="font-size: var(--h1); line-height: 0.95; letter-spacing: -0.04em; font-style: italic;">
        {收尾一句话 · 改我}
      </h2>

<!-- 4 件 inline shadcn-lite 组件 —— 直接 <Card> 用，不需要 import   -->
<!-- 适用场景：comparison-table / feature-cards / use-cases /        -->
<!--          variant-showcase / step-switcher / quadrant 等         -->
<!-- 详见 SKILL.md § Hybrid 选型表（decision/sales/launch/knowledge）  -->
<!-- 要 a11y / 全功能 → import @radix-ui/react-* 自己组（importmap 已就位）-->
<!-- ══════════════════════════════════════════════════════════════ -->
<script type="text/babel" id="__nd-shadcn-lite" data-type="module" data-presets="react,typescript" data-nodesign-keep="components">
  import React, { useState } from 'react';

  function Card({ children, className = '', ...rest }) {
    return (
      <div className={`rounded-xl border border-[var(--ink)]/10 bg-[var(--surface)] shadow-sm ${className}`} {...rest}>
        {children}
      </div>
    );
  }
  function CardHeader({ children, className = '' }) {
    return <div className={`flex flex-col gap-1.5 p-6 ${className}`}>{children}</div>;
  }
  function CardTitle({ children, className = '' }) {
    return <h3 className={`font-semibold text-2xl leading-none text-[var(--ink)] ${className}`}>{children}</h3>;
  }
  function CardContent({ children, className = '' }) {
    return <div className={`p-6 pt-0 ${className}`}>{children}</div>;
  }

  function Button({ variant = 'default', children, className = '', ...rest }) {
    const base = 'inline-flex items-center justify-center gap-2 rounded-md text-sm font-medium px-4 py-2 transition-colors';
    const variants = {
      default: 'bg-[var(--accent)] text-[var(--paper)] hover:opacity-90',
      outline: 'border border-[var(--ink)]/20 bg-transparent text-[var(--ink)] hover:bg-[var(--ink)]/5',
      ghost:   'bg-transparent text-[var(--ink)] hover:bg-[var(--ink)]/5',
    };
    return (
      <button className={`${base} ${variants[variant] || variants.default} ${className}`} {...rest}>
        {children}
      </button>
    );
  }

  function Badge({ variant = 'default', children, className = '' }) {
    const variants = {
      default:   'bg-[var(--accent)] text-[var(--paper)]',
      secondary: 'bg-[var(--ink)]/10 text-[var(--ink)]',
      outline:   'border border-[var(--ink)]/20 text-[var(--ink)]',
    };
    return (
      <span className={`inline-flex items-center rounded-full px-3 py-1 text-xs font-medium ${variants[variant] || variants.default} ${className}`}>
        {children}
      </span>
    );
  }

  // 受控/非受控两用 Tabs（不依赖 Radix；要 a11y 就 import @radix-ui/react-tabs）
  function Tabs({ defaultValue, value, onValueChange, children, className = '' }) {
    const [internal, setInternal] = useState(defaultValue);
    const active = value !== undefined ? value : internal;
    const setActive = (v) => { onValueChange ? onValueChange(v) : setInternal(v); };
    return (
      <div className={className}>
        {React.Children.map(children, (child) =>
          React.isValidElement(child) ? React.cloneElement(child, { active, setActive }) : child
        )}
      </div>
    );
  }
  function TabsList({ children, active, setActive, className = '' }) {
    return (
      <div className={`inline-flex items-center justify-center rounded-md bg-[var(--ink)]/5 p-1 ${className}`}>
        {React.Children.map(children, (child) =>
          React.isValidElement(child) ? React.cloneElement(child, { active, setActive }) : child
        )}
      </div>
    );
  }
  function TabsTrigger({ value, active, setActive, children, className = '' }) {
    const isActive = active === value;
    return (
      <button onClick={() => setActive(value)}
        className={`px-4 py-2 text-sm font-medium rounded transition-colors ${
          isActive
            ? 'bg-[var(--surface)] shadow-sm text-[var(--ink)]'
            : 'text-[var(--muted)] hover:text-[var(--ink)]'
        } ${className}`}>
        {children}
      </button>
    );
  }
  function TabsContent({ value, active, children, className = '' }) {
    if (active !== value) return null;
    return <div className={className}>{children}</div>;
  }

  // 暴露到全局供下方 __nd-app 段使用
  window.__ndShadcn = { Card, CardHeader, CardTitle, CardContent, Button, Badge, Tabs, TabsList, TabsTrigger, TabsContent };
</script>

<!-- Keyboard nav: ←↑/PgUp = prev, →↓/Space/PgDn = next, Home/End    -->
<!-- 滚轮按页切由系统 fit script 注的 scroll-snap-y mandatory 自动处理 -->
<!-- 这里只补键盘 + 父窗口 postMessage 同步当前页号                    -->
<!-- 多页才装；单页 deck 自动 noop                                    -->
<!-- data-nodesign-keep 让 build-standalone postprocess 永不删此脚本   -->
<!-- ══════════════════════════════════════════════════════════════ -->
<script data-nodesign-keep="navigation">
(function(){
  var sections = Array.prototype.slice.call(
    document.querySelectorAll('section[data-page]')
  );
  if (sections.length < 2) return;

  sections.sort(function(a, b){
    return (parseInt(a.dataset.page, 10) || 0) - (parseInt(b.dataset.page, 10) || 0);
  });

  var current = 0;

  function go(i){
    if (i < 0) i = 0;
    if (i >= sections.length) i = sections.length - 1;
    if (i === current) return;
    current = i;
    sections[i].scrollIntoView({ behavior: 'smooth', block: 'start' });
    var page = parseInt(sections[i].dataset.page, 10) || (i + 1);
    try {
      window.parent.postMessage({ type: 'canvas-page-change', page: page }, '*');
    } catch (e) { /* parent 不可达时无声 */ }
  }

  document.addEventListener('keydown', function(e){
    var t = e.target;
    if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
    switch (e.key) {
      case 'ArrowLeft':
      case 'ArrowUp':
      case 'PageUp':
        e.preventDefault(); go(current - 1); break;
      case 'ArrowRight':
      case 'ArrowDown':
      case 'PageDown':
      case ' ':
      case 'Spacebar':
        e.preventDefault(); go(current + 1); break;
      case 'Home':
        e.preventDefault(); go(0); break;
      case 'End':
        e.preventDefault(); go(sections.length - 1); break;
    }
  });

  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function(entries){
      var best = null;
      entries.forEach(function(en){
        if (!best || en.intersectionRatio > best.intersectionRatio) best = en;
      });
      if (best && best.isIntersecting) {
        var idx = sections.indexOf(best.target);
        if (idx >= 0 && idx !== current) {
          current = idx;
          var page = parseInt(best.target.dataset.page, 10) || (idx + 1);
          try {
            window.parent.postMessage({ type: 'canvas-page-change', page: page }, '*');
          } catch (e) { /* ignore */ }
        }
      }
    }, { threshold: [0.5] });
    sections.forEach(function(s){ io.observe(s); });
  }

  window.addEventListener('message', function(ev){
    if (!ev.data || ev.data.type !== 'canvas-go-page') return;
    var target = parseInt(ev.data.page, 10);
    if (!isFinite(target)) return;
    var idx = sections.findIndex(function(s){
      return (parseInt(s.dataset.page, 10) || 0) === target;
    });
    if (idx >= 0) go(idx);
  });
})();
</script>
