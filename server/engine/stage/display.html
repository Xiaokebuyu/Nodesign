<!doctype html>
<html lang="zh-CN" data-skin="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>演出</title>
<style>
/* ═══════════════════════════════════════════════════════════════
   RP 显示器 —— 骨架 + 可插拔配件（原型 2026-09-05 → 真件）
   骨架（四种玩法共用）：场景条 / 正文流 / 把手区 / 在场者槽 / 状态槽
   配件（按数据挂）：在场者槽两种呈现（一人=立绘；多人=名册）、状态槽四种呈现
   数据全部来自同目录的 state / events（api/stage.js），本页不存任何真相。
   ═══════════════════════════════════════════════════════════════ */
:root{
  --paper:#f4f1ea; --ink:#2b2926; --ink-soft:#6f6a61;
  --voice:#2e6b62; --accent:#8a6234; --rule:rgba(43,41,38,.13);
  --panel:#eeeae1; --code-bg:rgba(43,41,38,.055);
  --shadow:0 1px 2px rgba(43,41,38,.05),0 8px 22px rgba(43,41,38,.06);
  --serif:"Source Han Serif SC","Noto Serif SC","Songti SC",SimSun,Georgia,serif;
  --sans:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;
  --mono:"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --measure:39em; --lead:2.0; --size:16.5px;
}
:root[data-skin="night"]{
  --paper:#15171b; --ink:#dcd7ce; --ink-soft:#8a8780; --voice:#9ec7c0;
  --accent:#c9a227; --rule:rgba(220,215,206,.14); --panel:#1b1e23;
  --code-bg:rgba(220,215,206,.07);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.3);
}
:root[data-skin="jiangnan"]{
  --paper:#edf1f0; --ink:#26312f; --ink-soft:#64716e; --voice:#2f5d6b;
  --accent:#8a6f4e; --rule:rgba(38,49,47,.12); --panel:#e4e9e8;
  --code-bg:rgba(38,49,47,.05);
}
:root[data-skin="terminal"]{
  --paper:#0d100e; --ink:#c8d3c4; --ink-soft:#6c7a68; --voice:#7fd08a;
  --accent:#d9a441; --rule:rgba(200,211,196,.15); --panel:#12160f;
  --code-bg:rgba(127,208,138,.09);
  --serif:"SF Mono",Menlo,Consolas,"Songti SC",monospace;
  --size:15.5px; --lead:1.95; --measure:41em;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.4);
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;transition:background .35s,color .35s}

.stage{display:grid;grid-template-columns:238px 1fr;height:100%}
@media(max-width:860px){.stage{grid-template-columns:1fr;grid-template-rows:auto 1fr}}

/* ── 在场者槽 ───────────────────────────────────────────── */
.cast{background:var(--panel);border-right:1px solid var(--rule);
  display:flex;flex-direction:column;overflow:hidden;transition:background .35s}
@media(max-width:860px){
  .cast{border-right:0;border-bottom:1px solid var(--rule);flex-direction:row;
    align-items:center;gap:12px;padding:8px 12px;overflow-x:auto;overflow-y:hidden}
  .portrait{width:38px;height:38px;margin:0;aspect-ratio:1;border-radius:50%;flex:none}
  .portrait b{font-size:17px}
  .portrait i{display:none}
  .who{padding:0;flex:none}
  .who h3{margin:0;font-size:15px}
  .who p{display:none}
}
.portrait{margin:16px 16px 11px;aspect-ratio:3/4;border-radius:3px;position:relative;
  background:linear-gradient(160deg,#cdbba4,#9aa5a0 58%,#78868a);
  box-shadow:var(--shadow);display:grid;place-items:center;overflow:hidden;flex:none}
.portrait img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.portrait b{font-family:var(--serif);font-size:50px;color:rgba(255,255,255,.92);
  text-shadow:0 2px 14px rgba(0,0,0,.28)}
.portrait i{position:absolute;left:0;right:0;bottom:0;padding:5px 8px;font-style:normal;
  font-size:10px;letter-spacing:.04em;color:rgba(255,255,255,.8);
  background:linear-gradient(transparent,rgba(0,0,0,.5))}
.who{padding:0 16px 13px;flex:none}
.who h3{margin:0 0 3px;font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:.03em}
.who p{margin:0;font-size:11.5px;color:var(--ink-soft);line-height:1.5}

.roster{padding:14px 10px 8px;display:flex;flex-direction:column;gap:1px;overflow-y:auto;flex:1;min-height:0}
.roster .hd{font-size:10px;letter-spacing:.14em;color:var(--ink-soft);padding:0 6px 8px}
.mate{display:flex;align-items:center;gap:9px;padding:6px;border-radius:3px;
  border:1px solid transparent;transition:background .18s,border-color .18s}
.mate .av{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;
  font-size:12px;font-weight:600;color:var(--paper);background:var(--ink-soft);
  font-family:var(--serif);transition:background .25s;overflow:hidden}
.mate .av img{width:100%;height:100%;object-fit:cover}
.mate .nm{display:block;font-size:12.5px;font-weight:500;line-height:1.35}
.mate .du{display:block;font-size:10px;color:var(--ink-soft);line-height:1.3;margin-top:1px}
.mate.on{border-color:var(--accent)}
.mate.on .av{background:var(--accent)}
.mate.on .nm{color:var(--accent)}
@media(max-width:860px){
  .roster{flex-direction:row;gap:6px;padding:9px 12px;overflow-x:auto}
  .roster .hd{display:none}.mate{flex:none}.mate .du{display:none}
}

/* ── 状态槽 ─────────────────────────────────────────────── */
.vitals{padding:0 16px 14px;display:flex;flex-direction:column;gap:9px;flex:none}
.vital .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;
  font-size:11px;color:var(--ink-soft);letter-spacing:.02em}
.vital .row b{color:var(--ink);font-weight:600;font-size:12.5px;font-variant-numeric:tabular-nums}
.vital .row b small{font-size:9.5px;font-weight:400;color:var(--ink-soft);margin-left:2px}
.bar{height:3px;background:var(--rule);border-radius:2px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:2px;
  transition:width .55s cubic-bezier(.2,.7,.3,1)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:10px;padding:2px 6px;border:1px solid var(--rule);border-radius:2px;color:var(--ink-soft)}
.chip.on{color:var(--accent);border-color:var(--accent)}
@media(max-width:860px){.vitals{flex-direction:row;padding:0 12px 10px;gap:16px;overflow-x:auto}
  .vital{flex:none;min-width:78px}}
.cast .foot{margin-top:auto;padding:11px 16px;border-top:1px solid var(--rule);
  font-size:10px;color:var(--ink-soft);line-height:1.65;flex:none}
.cast .foot .st{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ink-soft);margin-right:5px;vertical-align:middle}
.cast .foot .st.on{background:#4c9a63}
.cast .foot .st.busy{background:var(--accent);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.35}}
@media(max-width:860px){.cast .foot{display:none}}

/* ── 正文流 ─────────────────────────────────────────────── */
.flow{display:flex;flex-direction:column;min-width:0;min-height:0}
.scene{flex:none;display:flex;align-items:center;gap:9px;padding:9px 22px;
  border-bottom:1px solid var(--rule);font-size:11.5px;color:var(--ink-soft);letter-spacing:.04em}
.scene .dot{width:4px;height:4px;border-radius:50%;background:var(--accent);flex:none}
.scene .sp{margin-left:auto;font-size:10.5px;opacity:.75}
.beats{flex:1;overflow-y:auto;padding:36px 22px 10px;scroll-behavior:smooth}
.beats-inner{max-width:var(--measure);margin:0 auto}
.beat{margin:0 0 38px;font-family:var(--serif);font-size:var(--size);line-height:var(--lead);
  letter-spacing:.012em;animation:rise .5s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.beat p{margin:0 0 .95em}
.beat p:last-child{margin-bottom:0}
.beat q{quotes:none;color:var(--voice);font-weight:500}
.beat em{font-style:italic;color:var(--ink-soft)}
.beat code{font-family:var(--mono);font-size:.88em;background:var(--code-bg);
  padding:1.5px 5px;border-radius:2px;letter-spacing:0}
.beat p.codeline{margin:0 0 .35em}
.beat p.codeline code{display:block;padding:7px 11px;border-left:2px solid var(--accent)}
.beat.me{position:relative;padding-left:16px;font-size:calc(var(--size) - 1px);color:var(--ink-soft)}
.beat.me::before{content:"";position:absolute;left:0;top:.4em;bottom:.4em;width:2px;
  background:var(--accent);opacity:.55;border-radius:2px}
.beat .tagline{font-family:var(--sans);font-size:10px;letter-spacing:.14em;color:var(--accent);margin-bottom:.5em}
.beat.dice{font-family:var(--sans);font-size:12px;color:var(--ink-soft);margin-bottom:22px;
  padding:8px 12px;border:1px dashed var(--rule);border-radius:3px}
.beat.dice b{color:var(--accent);font-variant-numeric:tabular-nums}
.beat.live{color:var(--ink-soft);opacity:.85}
.beat.live::after{content:"▍";color:var(--accent);animation:blink .9s infinite}
.empty{color:var(--ink-soft);font-family:var(--sans);font-size:13px;line-height:1.8;text-align:center;padding:40px 0}

/* ── 把手区 ─────────────────────────────────────────────── */
.handles{flex:none;padding:12px 22px 18px;border-top:1px solid var(--rule)}
.handles-inner{max-width:var(--measure);margin:0 auto;display:flex;flex-direction:column;gap:6px}
.handle{display:block;width:100%;text-align:left;font:inherit;cursor:pointer;
  padding:9px 13px;border:1px solid var(--rule);border-radius:3px;
  background:var(--panel);color:var(--ink);box-shadow:var(--shadow);
  transition:border-color .15s,transform .15s,opacity .2s}
.handle:hover{border-color:var(--accent);transform:translateX(2px)}
.handle:disabled{opacity:.45;cursor:default;transform:none}
.handle b{display:block;font-size:13px;font-weight:600;letter-spacing:.02em}
.handle span{display:block;font-size:11px;color:var(--ink-soft);line-height:1.5;margin-top:1px}
.handle.send{text-align:center;background:transparent;box-shadow:none;border-style:dashed}
.handle.send b{color:var(--ink-soft);font-weight:500;font-size:12px}
.say{display:flex;gap:7px;margin-top:2px}
.say textarea{flex:1;font:inherit;font-size:12.5px;padding:9px 12px;border-radius:3px;resize:none;
  border:1px solid var(--rule);background:var(--paper);color:var(--ink);outline:none;line-height:1.5;max-height:9em}
.say textarea:focus{border-color:var(--accent)}
.say button{font:inherit;font-size:12.5px;padding:0 15px;border-radius:3px;cursor:pointer;
  border:1px solid var(--accent);background:var(--accent);color:var(--paper)}
.say button:disabled{opacity:.5;cursor:default}
.note{font-size:11px;color:var(--ink-soft);text-align:center;padding-top:4px;min-height:1.4em}
.note.err{color:#b4533c}

/* 卡片里的缩略态：没有输入框，把手只看不点（卡整张是"打开"的按钮） */
body.embed .say,body.embed .note{display:none}
body.embed .handles{pointer-events:none}
body.embed .beats{padding-top:22px}
</style>
</head>
<body>
<div class="stage">
  <aside class="cast" id="cast"></aside>
  <main class="flow">
    <div class="scene"><span class="dot"></span><span id="scene-text"></span><span class="sp" id="title"></span></div>
    <div class="beats" id="beats"><div class="beats-inner" id="inner"></div></div>
    <div class="handles"><div class="handles-inner" id="handles"></div><div class="note" id="note"></div></div>
  </main>
</div>

<script>
(() => {
  // 本页住在 …/stage/view，同目录下就是 state / events / say / config
  const BASE = location.pathname.replace(/\/view\/?$/, '');
  const q = new URLSearchParams(location.search);
  const EMBED = q.get('embed') === '1';
  if (EMBED) document.body.classList.add('embed');

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  let CFG = null;           // stage.json 公开部分
  let SCENES = [];          // 一拍一行
  let STATUS = { running: false, busy: false, queued: 0 };
  let live = '';            // 正在流出来的字（工具之外的话，观众只当旁白看）
  let sending = false;

  /* 正文：agent 照旧写整段散文，成分识别归显示器。直引号转弯引号是排版的事。 */
  function render(text) {
    return String(text || '').split(/\n{2,}/).map((raw) => {
      const p = raw.trim();
      if (!p) return '';
      let h = esc(p)
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/&quot;([^&]*?)&quot;/g, '<q>“$1”</q>')
        .replace(/“([^”]*)”/g, '<q>“$1”</q>')
        .replace(/(「[^」]*」)/g, '<q>$1</q>')
        .replace(/\*([^*]+)\*/g, '<em>$1</em>')
        .replace(/\n/g, '<br>');
      const only = /^`[^`]+`$/.test(p);
      return `<p${only ? ' class="codeline"' : ''}>${h}</p>`;
    }).join('');
  }

  /* 状态值：每拍只传变了的键，这里顺着折成当前值 */
  function foldState() {
    const s = {};
    for (const r of SCENES) if (r.state) Object.assign(s, r.state);
    return s;
  }
  function lastStage() { for (let i = SCENES.length - 1; i >= 0; i--) if (SCENES[i].by === 'stage') return SCENES[i]; return null; }
  function lastScene() { for (let i = SCENES.length - 1; i >= 0; i--) if (SCENES[i].scene) return SCENES[i].scene; return ''; }

  /* ── 在场者槽：一人=立绘，多人=名册，同一个槽 ── */
  function paintCast() {
    const box = $('cast');
    const cast = (CFG && Array.isArray(CFG.cast)) ? CFG.cast : [];
    const S = foldState();
    const vitals = `<div class="vitals">${((CFG && CFG.vitals) || []).map((v) => {
      const val = S[v.key] ?? v.initial ?? '';
      const label = esc(v.label || v.key);
      if (v.as === 'bar') {
        const pct = Math.max(0, Math.min(100, (parseFloat(val) / (v.max || 100)) * 100)) || 0;
        return `<div class="vital"><div class="row"><span>${label}</span><b>${esc(val)}</b></div><div class="bar"><i style="width:${pct}%"></i></div></div>`;
      }
      if (v.as === 'chips') {
        return `<div class="vital"><div class="row"><span>${label}</span></div><div class="chips">${(v.options || []).map((o) => `<span class="chip${o === val ? ' on' : ''}">${esc(o)}</span>`).join('')}</div></div>`;
      }
      if (v.as === 'num') return `<div class="vital"><div class="row"><span>${label}</span><b>${esc(val)}${v.unit ? `<small>${esc(v.unit)}</small>` : ''}</b></div></div>`;
      return `<div class="vital"><div class="row"><span>${label}</span><b>${esc(val)}</b></div></div>`;
    }).join('')}</div>`;

    const st = STATUS.running ? (STATUS.busy ? 'busy' : 'on') : '';
    const stText = STATUS.running ? (STATUS.busy ? '台上正在写' : '台上在等你') : (CFG ? '散场了 · 说一句就再开' : '还没开戏');
    const foot = `<div class="foot"><span class="st ${st}"></span>${stText}${STATUS.queued ? ` · 排着 ${STATUS.queued} 句` : ''}<br>${esc(CFG?.footer || '')}</div>`;

    if (cast.length <= 1) {
      const m = cast[0] || { name: (CFG && CFG.title) || '演出', note: '' };
      const img = m.portrait ? `<img alt="" src="${esc(m.portrait)}">` : `<b>${esc(String(m.name || '').slice(0, 1))}</b><i>立绘位</i>`;
      box.innerHTML = `<div class="portrait">${img}</div><div class="who"><h3>${esc(m.name)}</h3><p>${esc(m.note || '')}</p></div>${vitals}${foot}`;
    } else {
      const on = new Set((lastStage()?.speakers) || []);
      box.innerHTML = `${vitals}<div class="roster"><div class="hd">在场 ${cast.length} 人</div>${cast.map((m) => `
        <div class="mate${on.has(m.name) ? ' on' : ''}" title="${esc(m.note || '')}">
          <span class="av">${m.portrait ? `<img alt="" src="${esc(m.portrait)}">` : esc(String(m.name || '').slice(0, 1))}</span>
          <span><span class="nm">${esc(m.name)}</span><span class="du">${esc(m.note || '')}</span></span></div>`).join('')}</div>${foot}`;
    }
  }

  function beatHtml(r) {
    if (r.by === 'user') return `<div class="beat me"><div class="tagline">你</div>${render(r.text)}</div>`;
    if (r.by === 'dice') return `<div class="beat dice">🎲 ${esc(r.reason || '')} · d${r.sides}×${(r.rolls || []).length} → [${(r.rolls || []).join(', ')}] = <b>${r.total}</b></div>`;
    return `<div class="beat">${render(r.text)}</div>`;
  }

  function paintAll() {
    const inner = $('inner');
    if (!SCENES.length && !live) {
      inner.innerHTML = `<div class="empty">${CFG ? '台上还是空的。<br>说一句话，戏就开了。' : '这个项目还没开过戏。'}</div>`;
    } else {
      inner.innerHTML = SCENES.map(beatHtml).join('') + (live ? `<div class="beat live" id="live">${render(live)}</div>` : '');
    }
    $('scene-text').textContent = lastScene();
    $('title').textContent = CFG?.title || '';
    document.documentElement.dataset.skin = (CFG && CFG.skin) || 'paper';
    paintCast();
    paintHandles();
    scrollDown();
  }
  function appendBeat(r) {
    $('inner').querySelector('.empty')?.remove();
    const liveEl = $('live');
    if (liveEl) liveEl.remove();
    $('inner').insertAdjacentHTML('beforeend', beatHtml(r));
    if (live) $('inner').insertAdjacentHTML('beforeend', `<div class="beat live" id="live">${render(live)}</div>`);
    if (r.scene) $('scene-text').textContent = r.scene;
    paintCast();
    paintHandles();
    scrollDown();
  }
  function paintLive() {
    let el = $('live');
    if (!live) { el?.remove(); return; }
    if (!el) {
      $('inner').querySelector('.empty')?.remove();
      $('inner').insertAdjacentHTML('beforeend', '<div class="beat live" id="live"></div>');
      el = $('live');
    }
    el.innerHTML = render(live);
    scrollDown();
  }
  // ⚠️ 不用 requestAnimationFrame：卡片预览里的 iframe 会被 frame-freeze 冻住 rAF 链，那样新的一拍到了也滚不到底
  function scrollDown() { setTimeout(() => { const b = $('beats'); b.scrollTop = b.scrollHeight; }, 0); }

  /* ── 把手区：上一拍留的把手 + 自己说 ── */
  function paintHandles() {
    const box = $('handles');
    const last = lastStage();
    // 上一拍之后用户已经说过话了 → 把手已经用掉，只留输入
    const lastRow = SCENES[SCENES.length - 1];
    const spent = lastRow && lastRow.by === 'user';
    let list = (last && !spent) ? (last.choices || []) : [];
    if (!list.length && CFG && !spent && last) list = [{ label: '继续', prompt: '继续。' }];
    const dis = (!CFG || STATUS.busy || sending) ? ' disabled' : '';
    box.innerHTML = list.map((c) => `<button class="handle${c.prompt ? '' : ' send'}" data-p="${esc(c.prompt || c.label)}"${dis}><b>${esc(c.label)}</b>${c.hint ? `<span>${esc(c.hint)}</span>` : ''}</button>`).join('')
      + `<div class="say"><textarea id="say" rows="1" placeholder="${CFG ? '或者直接说你要做什么（Enter 发送，Shift+Enter 换行）' : '还没开戏'}"${CFG ? '' : ' disabled'}></textarea><button id="sayGo"${dis}>说</button></div>`;
    box.querySelectorAll('.handle').forEach((b) => { b.onclick = () => fire(b.dataset.p); });
    const ta = $('say');
    const go = () => { const v = ta.value.trim(); if (v) { fire(v); ta.value = ''; } };
    $('sayGo').onclick = go;
    ta.onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); go(); } };
    ta.oninput = () => { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 140) + 'px'; };
  }

  /* 回传：直接进演出进程的队列，这条路上没有主 agent */
  async function fire(text) {
    if (!text || sending || EMBED) return;
    sending = true; note('');
    paintHandles();
    try {
      const res = await fetch(`${BASE}/say`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) });
      if (!res.ok) { const d = await res.json().catch(() => ({})); throw new Error(d.error || res.statusText); }
    } catch (err) {
      note(`没送出去：${err.message}`, true);
    } finally { sending = false; paintHandles(); }
  }
  function note(t, err) { const n = $('note'); n.textContent = t || ''; n.className = 'note' + (err ? ' err' : ''); }

  function tellParent() {
    try { parent !== window && parent.postMessage({ nd: 'stage', ...STATUS, title: CFG?.title || null, skin: CFG?.skin || 'paper' }, location.origin); } catch { /* 跨源就算了 */ }
  }

  /* ── 事件流 ── */
  function onEvent(e) {
    switch (e.type) {
      case 'hello':
        CFG = e.config; SCENES = e.scenes || []; live = e.live || '';
        STATUS = { running: !!e.running, busy: !!e.busy, queued: e.queued || 0, error: e.error || null };
        paintAll(); tellParent(); break;
      case 'scene':
        live = ''; SCENES.push(e.row); appendBeat(e.row); break;
      case 'text':
        live += e.text; paintLive(); break;
      case 'turn_end':
        live = ''; paintLive(); if (e.error) note(`这一拍没写完：${e.error}`, true); break;
      case 'status':
        STATUS = { running: !!e.running, busy: !!e.busy, queued: e.queued || 0, error: e.error || null };
        paintCast(); paintHandles(); tellParent(); break;
      case 'config':
        CFG = e.config; document.documentElement.dataset.skin = CFG.skin || 'paper'; $('title').textContent = CFG.title || ''; paintCast(); tellParent(); break;
      case 'error':
        note(`演出进程出错：${e.error}`, true); break;
      default: break;
    }
  }

  let es = null; let retry = 1000;
  function connect() {
    es = new EventSource(`${BASE}/events`);
    es.onmessage = (m) => { retry = 1000; try { onEvent(JSON.parse(m.data)); } catch { /* 半行 */ } };
    es.onerror = () => {
      es.close();
      setTimeout(connect, retry);
      retry = Math.min(retry * 2, 15000);
    };
  }
  // 父窗（StageWindow 工具栏）改皮肤时不经服务端也能先变脸，服务端那份随后经 config 事件对齐
  window.addEventListener('message', (e) => {
    if (e.origin !== location.origin || !e.data || e.data.nd !== 'stage-skin') return;
    document.documentElement.dataset.skin = e.data.skin || 'paper';
  });
  connect();
})();
</script>
</body>
</html>
