<!doctype html>
<html lang="zh-CN" data-skin="paper" data-dock="left" data-cast="open">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>故事</title>
<link rel="stylesheet" href="../ui/app.css">
<link rel="stylesheet" href="../ui/pages.css">
</head>
<body>
<!--
  RP 显示器（2026-09-06 重写）
  骨架：顶栏（题 / 场景 / 页面 / 上下文 / 状态 / 线路）· 侧栏（人物与状态，停左停右都行）· 主区（按页切）
  页面在 ND.pages 注册表里：故事 / 角色 / 记忆 / 设定 / 状态；故事还没开始时故事页让位给开场页。
  数据全部来自同目录的 state / events（api/stage.js），本页不存任何真相。
-->
<div class="backdrop" id="backdrop"></div>
<div class="app">
  <header class="top">
    <div class="top-l">
      <button class="icon-btn" id="castToggle" title="人物与状态" style="display:none"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg></button>
      <span class="dot" id="statusDot"></span>
      <b id="title">故事</b>
      <span class="scene" id="sceneText"></span>
    </div>
    <nav class="pages" id="pageNav"></nav>
    <div class="top-r">
      <button class="icon-btn" id="peekBtn" title="看背景（把字暂时收起来，再点一下回来）" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
      <button class="linebtn" id="lineBtn" hidden></button>
      <span class="pill" id="ctxPill"></span>
      <span class="pill status" id="statusText"></span>
    </div>
  </header>
  <aside class="cast" id="cast"></aside>
  <main class="main" id="main"></main>
</div>
<div class="drawer-veil" id="drawerVeil"></div>
<div class="toasts" id="toasts"></div>
<style>@media(max-width:760px){#castToggle{display:grid!important}}</style>
<script src="../ui/render.js"></script>
<script src="../ui/marks.js"></script>
<script src="../ui/app.js"></script>
<script src="../ui/panel.js"></script>
<script src="../ui/story.js"></script>
<script src="../ui/opening.js"></script>
<script src="../ui/pages.js"></script>
<script src="../ui/panels.js"></script>
<script>window.ND.boot();</script>
</body>
</html>
