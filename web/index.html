<html lang="zh-CN" translate="no">
  <head>
    <meta charset="UTF-8" />
    <!-- 拦浏览器翻译插件：翻译层替换文本节点会让 React insertBefore 崩（NotFoundError） -->
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%201024%201024%22%20width%3D%221024%22%20height%3D%221024%22%3E%3Crect%20width%3D%221024%22%20height%3D%221024%22%20rx%3D%22224%22%20fill%3D%22%23F0EADB%22%2F%3E%3Crect%20x%3D%228%22%20y%3D%228%22%20width%3D%221008%22%20height%3D%221008%22%20rx%3D%22216%22%20fill%3D%22none%22%20stroke%3D%22%232B2117%22%20stroke-opacity%3D%22.28%22%20stroke-width%3D%2216%22%2F%3E%3Cpath%20d%3D%22M252.0%20200.0L400.0%20200.0L400.0%20824.0L252.0%20824.0ZM252.0%20200.0L400.0%20200.0L586.0%20512.0L438.0%20512.0Z%22%20fill%3D%22%235A554E%22%2F%3E%3Cpath%20d%3D%22M476.0%20512.0L548.0%20512.0L734.0%20824.0L662.0%20824.0ZM662.0%20200.0L734.0%20200.0L734.0%20824.0L662.0%20824.0Z%22%20fill%3D%22%232B2117%22%2F%3E%3C%2Fsvg%3E" />
    <!-- 手机上关掉整页缩放：版面是竖着读的，捏合放大之后还得左右滑（2026-08-21 用户报的）。
         ⚠️ Safari 从 iOS 10 起无视这两个参数，那条路在 lib/lock-zoom.js 里补

         interactive-widget=resizes-visual（2026-08-31）＝ **键盘覆盖模式**：
         软键盘弹出时只缩视觉视口，**布局视口和 dvh 一个像素都不动**，页面不重排 ——
         画布不会因为弹个键盘就跳一下。
         ⭐ 这也正是 Chrome 108 起安卓的默认值、以及 iOS Safari 一直以来的行为，
           所以写它**不是在改行为，是把行为钉住**（默认值会变，我们的依赖不该跟着变）。
         ⛔ 别改成 resizes-content：那是 Chrome 108 之前的老行为，回去等于让画布
           跟着键盘一起重排。也别用 overlays-content：那个连视觉视口都不缩，
           于是 visualViewport 量不出键盘多高，下面那套"自己抬"就没了依据。
         配套：lib/use-keyboard-inset.js（谁被盖住谁自己抬 —— body 是 fixed，
         浏览器已经没法替我们滚了）。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-visual" />
    <title>Nodesign · 创作者的 agent 工作台</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
