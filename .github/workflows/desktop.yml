# Windows 桌面版打包（见 desktop/README.md）。
#
# 为什么在这里打而不在开发机上：三个 win32 产物（SDK 的 claude.exe、better-sqlite3 的 Electron ABI
# 预编译、sharp 的 win32 包）在 Windows 上都是 npm 的默认行为；在 Linux 上交叉装要一路覆盖还没法跑起来验。
#
# 触发：
#   - 手动：Actions 页面 → "desktop" → Run workflow（分支任选）
#   - 打 tag：git tag desktop-v0.0.10 && git push origin desktop-v0.0.10
# 产物：GitHub Releases 里一份**草稿**（v<package.json 的 version>），含 NoDesign-Setup-<v>.exe、
# .blockmap、latest.yml。草稿只有仓库成员看得到；点 Publish 之后 electron-updater 才会把它当更新。
name: desktop

on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']

permissions:
  contents: write   # 往 Releases 传产物

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24   # node:sqlite 在 24 上已稳定（22 会打实验警告，且缺 timeout 选项）
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: 装依赖（根 + web）
        run: |
          npm ci
          npm ci --prefix web

      - name: 构建前端（进安装包的是 web/dist）
        run: npm run build:web

      # 服务端的运行时：跟上面 npm ci 用的是同一个 node（同一个 ABI），原生模块的预编译直接能用
      - name: 抓一份 node.exe 进安装包
        shell: pwsh
        run: |
          $v = node -p "process.version"
          Invoke-WebRequest "https://nodejs.org/dist/$v/node-$v-win-x64.zip" -OutFile node.zip
          Expand-Archive node.zip -DestinationPath node-dist
          New-Item -ItemType Directory -Force desktop/components/node | Out-Null
          Copy-Item "node-dist/node-$v-win-x64/node.exe" desktop/components/node/node.exe
          & desktop/components/node/node.exe -p "'bundled ' + process.version + ' abi ' + process.versions.modules"

      # electron-builder 的老毛病：release 还不存在时几个上传并发各建一个草稿，exe 和 blockmap 分家（09-06 实测）。
      # 先把草稿建好，它就只会往里传。
      - name: 预建草稿 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = node -p "require('./package.json').version"
          gh release view "v$v" --json isDraft 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create "v$v" --draft --title "$v" --notes "NoDesign Windows 桌面版 $v" }

      - name: 打包并传到 GitHub Releases（草稿）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 没证书：electron-builder 会警告一次，装的时候 SmartScreen 拦一道"未知发布者"
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win --publish always

      # 三个资产（exe / blockmap / latest.yml）都传完才发布：先发布再传的话，这几分钟里客户端拉 latest.yml 是 404。
      # 站主 09-07：现在只有他一台机器在用、在调试，每版点 Publish 是纯麻烦 —— 直接发。有外部用户后想恢复"先验再推"，删掉这一步即可。
      - name: 发布（草稿 → 正式，成为 latest；装了的机器下次启动自动更新）
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = node -p "require('./package.json').version"
          gh release edit "v$v" --draft=false --latest

      - name: 产物也留一份在 Actions 里（不想动 Releases 时从这里下）
        uses: actions/upload-artifact@v4
        with:
          name: nodesign-desktop-windows
          path: |
            dist-desktop/*.exe
            dist-desktop/*.blockmap
            dist-desktop/latest.yml
          if-no-files-found: error
