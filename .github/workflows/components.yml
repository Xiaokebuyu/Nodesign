# Windows 桌面版的组件包（git / ffmpeg / poppler / LibreOffice / rembg 环境）→ GitHub Release `components-win64`。
# 应用起动时读这个 release 里的 manifest.json（server/runtime/components.js），换组件版本只要重跑这个工作流。
#
# 触发：Actions → components → Run workflow（工作流在默认分支上时），或推一个 components-build-* tag。版本在下面 env 里钉死。
name: components

on:
  workflow_dispatch:
  push:
    tags: ['components-build-*']   # workflow_dispatch 要工作流在默认分支上；分支上先用 tag 触发

permissions:
  contents: write

env:
  RELEASE_TAG: components-win64
  GIT_VER: 2.55.0.5
  GIT_TAG: v2.55.0.windows.5
  FFMPEG_TAG: autobuild-2026-09-06-13-06
  FFMPEG_FILE: ffmpeg-n8.1.2-50-g1a748fe2cd-win64-gpl-8.1.zip
  FFMPEG_VER: 8.1.2
  POPPLER_TAG: v26.07.0-0
  POPPLER_FILE: Release-26.07.0-0.zip
  POPPLER_VER: 26.07.0
  LO_VER: 26.8.0
  PY_VER: 3.12.10

jobs:
  win64:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 装依赖（要 playwright 的版本号）
        run: npm ci --omit=dev

      - name: 上游拿现成的（git / ffmpeg / poppler）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Invoke-WebRequest "https://github.com/git-for-windows/git/releases/download/$env:GIT_TAG/MinGit-$env:GIT_VER-64-bit.zip" -OutFile out/git.zip
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/$env:FFMPEG_TAG/$env:FFMPEG_FILE" -OutFile out/ffmpeg.zip
          Invoke-WebRequest "https://github.com/oschwartz10612/poppler-windows/releases/download/$env:POPPLER_TAG/$env:POPPLER_FILE" -OutFile out/poppler.zip
          Get-ChildItem out

      # msiexec /a = 管理安装：只把 MSI 里的文件铺到目录，不真装、不要管理员。铺出来 soffice.exe 的上一级就是根
      - name: LibreOffice（管理安装抽文件 + 兜底中文字体）
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Invoke-WebRequest "https://download.documentfoundation.org/libreoffice/stable/$env:LO_VER/win/x86_64/LibreOffice_${env:LO_VER}_Win_x86-64.msi" -OutFile lo.msi
          Start-Process msiexec -ArgumentList '/a', "$PWD\lo.msi", '/qn', "TARGETDIR=$PWD\lo-extract" -Wait
          $soffice = Get-ChildItem lo-extract -Recurse -Filter soffice.exe | Select-Object -First 1
          if (-not $soffice) { throw 'soffice.exe not found after admin install' }
          $root = $soffice.Directory.Parent.FullName
          Write-Host "LibreOffice root: $root"
          # 兜底中文字体（09-08）：非中文 Windows 缺楷体 / 仿宋 / 黑体时渲页用它们替（lib/cjk-fonts.js 写进 LO profile 的替换表，
          # Always=false：真字体在就用真的）。放 LO 自己的 share/fonts/truetype，不碰系统字体目录，卸组件就一起没了。
          $fonts = Join-Path $root 'share\fonts\truetype'
          New-Item -ItemType Directory -Force -Path $fonts | Out-Null
          $base = 'https://github.com/notofonts/noto-cjk/raw/main'
          foreach ($f in @('Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf', 'Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Bold.otf', 'Serif/OTF/SimplifiedChinese/NotoSerifCJKsc-Regular.otf', 'Serif/OTF/SimplifiedChinese/NotoSerifCJKsc-Bold.otf')) {
            Invoke-WebRequest "$base/$f" -OutFile (Join-Path $fonts (Split-Path $f -Leaf))
          }
          gh release download --repo lxgw/LxgwWenKai --pattern 'LXGWWenKai-Regular.ttf' --pattern 'LXGWWenKai-Medium.ttf' --dir $fonts
          # 朱雀仿宋只发 zip（预发布），解开取 ttf
          gh release download v0.212 --repo TrionesType/zhuque --pattern '*.zip' --dir zhuque
          7z x (Get-ChildItem zhuque -Filter *.zip | Select-Object -First 1).FullName -ozhuque-x | Out-Null
          Get-ChildItem zhuque-x -Recurse -Include *.ttf, *.otf | Copy-Item -Destination $fonts
          Get-ChildItem $fonts | ForEach-Object { Write-Host ("font {0} {1:N0} bytes" -f $_.Name, $_.Length) }
          7z a -tzip -mx=5 "$PWD\out\libreoffice.zip" "$root\*" | Out-Null

      # 嵌入式 Python + pip + rembg(cpu) + 模型：让 rembg 自己把两个模型下到 U2NET_HOME，文件名由它定
      #
      # ⛔⛔ C++ 运行库必须**跟着包走**（09-10 案）：嵌入式 Python 只带 vcruntime140*.dll，
      # 而 onnxruntime 的 onnxruntime_pybind11_state.pyd 还要 MSVCP140.dll / MSVCP140_1.dll ——
      # 那两个原本是从用户机器的 System32 拿的。于是包里那份新 vcruntime（14.42，压得过 System32，
      # 因为应用目录的搜索顺序在它前面）跟用户那份老 msvcp140 配成一对，DllMain 里就挂了：
      # 站主机器上九次会话次次 `DLL 初始化例程失败`，抠图从来没能用（onnxruntime 官方也写着
      # Windows 要 VC++ 运行库、建议最新版）。整套一起拷、别只拷 msvcp140 —— 半套就是换个方向的混搭。
      - name: rembg 环境
        shell: pwsh
        run: |
          Invoke-WebRequest "https://www.python.org/ftp/python/$env:PY_VER/python-$env:PY_VER-embed-amd64.zip" -OutFile py.zip
          Expand-Archive py.zip -DestinationPath rembg-env
          $pth = Get-ChildItem rembg-env -Filter 'python*._pth' | Select-Object -First 1
          (Get-Content $pth.FullName) -replace '^#import site', 'import site' | Set-Content $pth.FullName
          Invoke-WebRequest https://bootstrap.pypa.io/get-pip.py -OutFile get-pip.py
          & rembg-env\python.exe get-pip.py --no-warn-script-location
          & rembg-env\python.exe -m pip install --no-warn-script-location "rembg[cpu]" fastapi uvicorn
          New-Item -ItemType Directory -Force rembg-env\models | Out-Null
          $env:U2NET_HOME = "$PWD\rembg-env\models"
          & rembg-env\python.exe -c "from rembg import new_session; new_session('isnet-general-use'); new_session('birefnet-general-lite'); print('models ok')"
          Get-ChildItem rembg-env\models
          # 先不压：运行库还没拷进去（压 484MB 要好几分钟，压两遍没意义）

      # 判据不能是"在这台机器上 import 得动"——跑器自己装着运行库，那只证明跑器装着（09-10 假绿）。
      # 要查的是**包里有没有**：拷完逐个 Test-Path，缺一个就 throw（pwsh 的 ErrorActionPreference
      # 管不了外部命令，所以判据一律自己 throw，别指望上一条命令的退出码）。
      - name: C++ 运行库跟着包走（onnxruntime 要 MSVCP140*）
        shell: pwsh
        run: |
          $crt = Get-ChildItem 'C:\Program Files\Microsoft Visual Studio\2022\*\VC\Redist\MSVC\*\x64\Microsoft.VC143.CRT' -Directory -EA SilentlyContinue |
                 Sort-Object { [version]$_.Parent.Parent.Name } | Select-Object -Last 1
          if (-not $crt) { throw '找不到 VC143 redist 目录（跑器上的 VS 2022 布局变了？）' }
          Write-Host "CRT 来源：$($crt.FullName)"
          # 拷之前记下 Python 自带那份的版本：redist 比它旧就是**降级**，反而会把 Python 自己弄坏
          $before = [version](Get-Item 'rembg-env\vcruntime140.dll').VersionInfo.FileVersion
          Copy-Item "$($crt.FullName)\*.dll" rembg-env\ -Force
          $after = [version](Get-Item 'rembg-env\vcruntime140.dll').VersionInfo.FileVersion
          if ($after -lt $before) { throw "redist 的 vcruntime140 ($after) 比 Python 自带的 ($before) 旧，别拷" }
          foreach ($d in 'msvcp140.dll', 'msvcp140_1.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            $f = Get-Item "rembg-env\$d" -EA SilentlyContinue
            if (-not $f) { throw "包里缺 $d —— 用户机器上 onnxruntime 会以「DLL 初始化例程失败」告终" }
            Write-Host ("  {0}  {1}" -f $d, $f.VersionInfo.FileVersion)
          }
          # 换完运行库再 import 一次。⚠️ 这**不能**证明用户机器上能用（跑器自己装着 redist），
          # 它只证明上面那几行没把这个 env 弄坏 —— 真正的判据是上面的"包里有没有"。
          & rembg-env\python.exe -c "import onnxruntime; print('onnxruntime', onnxruntime.__version__)"
          if ($LASTEXITCODE -ne 0) { throw "拷完运行库反而 import 不动了（退出码 $LASTEXITCODE）" }
          7z a -tzip -mx=5 "$PWD\out\rembg.zip" "$PWD\rembg-env\*" | Out-Null

      - name: 版本表 + manifest.json
        shell: pwsh
        run: |
          # rembg 版本号带上 +crt：09-10 起包里自带 VC++ 运行库，装过旧包的用户界面上要看得出这是不同的一份
          # （"有更新"那个判据认的是 sha256，见 runtime/components.js；版本号只是给人看的）
          @{ git = $env:GIT_VER; ffmpeg = $env:FFMPEG_VER; poppler = $env:POPPLER_VER; libreoffice = $env:LO_VER; rembg = "py$env:PY_VER+crt" } | ConvertTo-Json | Set-Content out/versions.json
          node desktop/components/build-manifest.mjs out $env:RELEASE_TAG
          Get-Content out/manifest.json

      - name: 传到 release（不存在就建；已有的资产覆盖）
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view $env:RELEASE_TAG 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $env:RELEASE_TAG --title "Windows 组件包" --notes "NoDesign 桌面版按需下载的外部程序。由 .github/workflows/components.yml 生成，应用读 manifest.json。" }
          gh release upload $env:RELEASE_TAG out/git.zip out/ffmpeg.zip out/poppler.zip out/libreoffice.zip out/rembg.zip out/manifest.json --clobber
